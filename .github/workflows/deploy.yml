name: פרסום האתר
# מפרסם את האתר ל-GitHub Pages, ומכניס את מפתח Firebase מתוך הכספת של המאגר (Settings → Secrets → FIREBASE_API_KEY).
# כך המפתח לא נמצא בקוד ולא בהיסטוריה, אבל האתר שמתפרסם מקבל אותו.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    # כל הבדיקות האוטומטיות (tests/run.js). אם משהו נכשל, האתר לא מתעדכן והגרסה הקודמת נשארת באוויר.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: התקנת דפדפן לבדיקות
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: הרצת הבדיקות
        run: node tests/run.js
  deploy:
    needs: test
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: הכנסת המפתח מהכספת
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then echo "::error::חסר הסוד FIREBASE_API_KEY בהגדרות המאגר (Settings → Secrets and variables → Actions)"; exit 1; fi
          python3 - <<'PY'
          import os, re
          s = open('config.js', encoding='utf-8').read()
          s, n = re.subn(r'''((?:apiKey|key)\s*:\s*)(['"])[^'"]*\2''', lambda m: m.group(1) + m.group(2) + os.environ['FIREBASE_API_KEY'] + m.group(2), s, count=1)
          assert n == 1, 'key line not found in config.js'
          open('config.js', 'w', encoding='utf-8').write(s)
          PY
      - name: הכנת קבצי האתר
        run: |
          mkdir _site
          for f in $(ls -A); do case "$f" in .git|.github|.claude|_site|tools|tests|node_modules|package.json|package-lock.json|.gitleaks.toml|SECURITY.md|CLAUDE.md|.gitignore) ;; *) cp -r "$f" _site/ ;; esac; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: first_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: המתנה לפני ניסיון נוסף
        if: steps.first_try.outcome == 'failure'
        run: sleep 30
      - id: second_try
        # תקלות זמניות אצל GitHub קורות. ניסיון שני אוטומטי, ורק אם גם הוא נכשל הפרסום נכשל.
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first_try.outputs.page_url || steps.second_try.outputs.page_url }}" >> "$GITHUB_OUTPUT"
